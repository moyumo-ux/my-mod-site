<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/my-mod-site/css/base.css">
    <link rel="stylesheet" href="/my-mod-site/css/loading.css">
    <link rel="stylesheet" href="/my-mod-site/css/header.css">
    <link rel="stylesheet" href="/my-mod-site/css/spectrum.css">
    <link rel="stylesheet" href="/my-mod-site/css/doc-line.css">
    <link rel="stylesheet" href="/my-mod-site/css/main.css">
    <link rel="stylesheet" href="/my-mod-site/css/mod-cards.css">
    <link rel="stylesheet" href="/my-mod-site/css/titlebar.css">
    <link rel="stylesheet" href="/my-mod-site/css/transition.css">
    <link rel="stylesheet" href="/my-mod-site/css/transition-detail.css">
    <link rel="stylesheet" href="/my-mod-site/css/detail-top.css">
    <link rel="stylesheet" href="/my-mod-site/css/detail-toc.css">
    <link rel="stylesheet" href="/my-mod-site/css/detail-table.css">
    <link rel="stylesheet" href="/my-mod-site/css/detail.css">
    <link rel="icon" href="data:,">
</head>
<body>
    {{ partial "transition-detail.html" . }}
    <div class="detail-top-wrapper">
        <img src="/my-mod-site/images/moddetail_top.png" class="moddetail-top" alt="">
        <div class="spectrum-bar-detail"></div>
    </div>

    <div class="detail-logo">
        <img src="/my-mod-site/images/logo.png" alt="Logo1">
    </div>

    <a href="/my-mod-site/" class="back-link-ef">
        <span class="ef-btn-indicator"></span>
        <span class="ef-btn-text">返回首页</span>
    </a>

    {{ partial "bottom.html" . }}

    <div id="mainContent" class="visible">
        <div class="mod-detail-wrapper">
            <div class="mod-detail-content-wrap">
                <div class="mod-detail-header">
                    <div class="deco-left">
                        <svg class="deco-blocks" viewBox="0 0 23 7" xmlns="http://www.w3.org/2000/svg">
                            <rect x="0" y="0" width="3" height="3"/>
                            <rect x="4" y="0" width="3" height="3"/>
                            <rect x="8" y="0" width="3" height="3"/>
                            <rect x="12" y="0" width="3" height="3"/>
                            <rect x="16" y="0" width="3" height="3"/>
                            <rect x="20" y="0" width="3" height="3"/>
                            <rect x="0" y="4" width="3" height="3"/>
                            <rect x="4" y="4" width="3" height="3"/>
                            <rect x="8" y="4" width="3" height="3"/>
                            <rect x="12" y="4" width="3" height="3"/>
                            <rect x="16" y="4" width="3" height="3"/>
                            <rect x="20" y="4" width="3" height="3"/>
                        </svg>
                    </div>
                    <h1>{{ .Title }}</h1>
                </div>
                <div class="mod-detail-content" id="modContent">
                    {{ .Content | markdownify }}
                </div>
            </div>

            <div class="toc-sidebar" id="tocSidebar">
                <div class="toc-title">目录</div>
                <nav id="tocNav"></nav>
            </div>
        </div>
    </div>

    <script src="/my-mod-site/js/transition-detail.js"></script>
    <script src="/my-mod-site/js/detail.js"></script>
    <script src="/my-mod-site/js/custom-scrollbar.js"></script>
</body>
</html>
